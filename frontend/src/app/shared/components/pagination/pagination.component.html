<nav class="d-flex justify-content-between align-items-center mt-3" *ngIf="totalCount > 0">
  <span class="text-muted small">
    Página {{ pageNumber }} de {{ totalPages }} &middot; {{ totalCount }} registro(s)
  </span>

  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="!hasPreviousPage">
      <button class="page-link" (click)="goTo(pageNumber - 1)" [disabled]="!hasPreviousPage">
        <i class="bi bi-chevron-left"></i> Anterior
      </button>
    </li>
    <li class="page-item" [class.disabled]="!hasNextPage">
      <button class="page-link" (click)="goTo(pageNumber + 1)" [disabled]="!hasNextPage">
        Siguiente <i class="bi bi-chevron-right"></i>
      </button>
    </li>
  </ul>
</nav>
