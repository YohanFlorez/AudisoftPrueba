<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEditing ? 'Editar' : 'Nuevo' }} estudiante</h5>
          <button type="button" class="btn-close" (click)="close()"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre del estudiante"
                 [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched"
                 appBloquearNumeros>

          <div class="invalid-feedback" *ngIf="form.get('nombre')?.errors?.['required']">
            El nombre es obligatorio.
          </div>
          <div class="invalid-feedback" *ngIf="form.get('nombre')?.errors?.['maxlength']">
            El nombre no puede superar los 150 caracteres.
          </div>
          <div class="invalid-feedback" *ngIf="form.get('nombre')?.errors?.['pattern']">
            El nombre no debe contener números ni símbolos, solo letras.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
