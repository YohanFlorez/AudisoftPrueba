<div class="card p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Estudiantes</h4>
    <button *appIsAdmin class="btn btn-primary" (click)="openCreate()">
      <i class="bi bi-plus-lg me-1"></i> Nuevo estudiante
    </button>
  </div>

  <div class="mb-3">
    <app-search-box
      placeholder="Buscar por nombre..."
      (searchChange)="onSearchChange($event)">
    </app-search-box>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th style="width: 80px;">Id</th>
          <th>Nombre</th>
          <th style="width: 200px;" class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of paged?.items">
          <td>{{ e.id }}</td>
          <td>{{ e.nombre }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-2" (click)="openDetail(e)" title="Ver detalle">
              <i class="bi bi-eye"></i>
            </button>
            <button *appIsAdmin class="btn btn-sm btn-outline-secondary me-2" (click)="openEdit(e)" title="Editar">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button *appIsAdmin class="btn btn-sm btn-outline-danger" (click)="remove(e)" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="!loading && paged?.items?.length === 0">
          <td colspan="3" class="text-center text-muted py-4">
            {{ searchTerm ? 'No se encontraron estudiantes para "' + searchTerm + '".' : 'No hay estudiantes registrados.' }}
          </td>
        </tr>
        <tr *ngIf="loading">
          <td colspan="3" class="text-center text-muted py-4">Cargando...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-pagination
    *ngIf="paged"
    [pageNumber]="paged.pageNumber"
    [totalPages]="paged.totalPages"
    [hasPreviousPage]="paged.hasPreviousPage"
    [hasNextPage]="paged.hasNextPage"
    [totalCount]="paged.totalCount"
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>

<app-estudiante-form-modal
  *ngIf="showModal"
  [estudiante]="estudianteAEditar"
  (saved)="onSaved()"
  (cancelled)="closeModal()">
</app-estudiante-form-modal>

<app-estudiante-detail-modal
  *ngIf="showDetailModal && estudianteIdSeleccionado !== null"
  [estudianteId]="estudianteIdSeleccionado"
  (closed)="closeDetailModal()">
</app-estudiante-detail-modal>
