<!-- features/auth/login/login.component.html -->
<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow-sm" style="width: 380px;">
    <h4 class="text-center mb-4">
      <i class="bi bi-mortarboard-fill me-2"></i>Audisoft · Iniciar sesión
    </h4>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" formControlName="nombreUsuario"
               placeholder="Nombre de usuario"
               [class.is-invalid]="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
        <div class="invalid-feedback">El usuario es obligatorio.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" formControlName="password"
               placeholder="Contraseña"
               [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
        <div class="invalid-feedback">La contraseña es obligatoria.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <i class="bi bi-box-arrow-in-right me-1"></i>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
    <p class="text-center mt-3 mb-0">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
