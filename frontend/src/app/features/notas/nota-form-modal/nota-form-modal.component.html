<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEditing ? 'Editar' : 'Nueva' }} nota</h5>
          <button type="button" class="btn-close" (click)="close()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre / Descripción</label>
            <input type="text" class="form-control" formControlName="nombre" placeholder="Ej: Primer corte - Matemáticas"
                   [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
            <div class="invalid-feedback">El nombre es obligatorio (máx. 150 caracteres).</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Valor (0.0 - 5.0)</label>
            <input type="number" step="0.1" min="0" max="5" class="form-control" formControlName="valor"
                   [class.is-invalid]="form.get('valor')?.invalid && form.get('valor')?.touched">
            <div class="invalid-feedback">El valor debe estar entre 0.0 y 5.0.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Estudiante</label>
            <select class="form-select" formControlName="idEstudiante"
                    [class.is-invalid]="form.get('idEstudiante')?.invalid && form.get('idEstudiante')?.touched">
              <option [ngValue]="null" disabled>Seleccione un estudiante</option>
              <option *ngFor="let e of estudiantes" [ngValue]="e.id">{{ e.nombre }}</option>
            </select>
            <div class="invalid-feedback">Debe seleccionar un estudiante.</div>
          </div>

          <div class="mb-1">
            <label class="form-label">Profesor</label>
            <select class="form-select" formControlName="idProfesor"
                    [class.is-invalid]="form.get('idProfesor')?.invalid && form.get('idProfesor')?.touched">
              <option [ngValue]="null" disabled>Seleccione un profesor</option>
              <option *ngFor="let p of profesores" [ngValue]="p.id">{{ p.nombre }}</option>
            </select>
            <div class="invalid-feedback">Debe seleccionar un profesor.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
