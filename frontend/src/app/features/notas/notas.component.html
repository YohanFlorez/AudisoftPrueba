<div class="card p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-journal-check me-2"></i>Notas</h4>
    <button *appIsAdmin class="btn btn-primary" (click)="openCreate()">
      <i class="bi bi-plus-lg me-1"></i> Nueva nota
    </button>
  </div>

  <!-- Filtros -->
  <form [formGroup]="filterForm" class="row g-2 mb-3">
    <div class="col-md-3">
      <label class="form-label small text-muted mb-1">Nombre</label>
      <input type="text" class="form-control form-control-sm" placeholder="Buscar por nombre..."
             formControlName="nombre">
    </div>
    <div class="col-md-2">
      <label class="form-label small text-muted mb-1">Valor</label>
      <input type="number" step="0.1" min="0" max="5" class="form-control form-control-sm"
             placeholder="Ej: 4.5" formControlName="valor">
    </div>
    <div class="col-md-3">
      <label class="form-label small text-muted mb-1">Estudiante</label>
      <select class="form-select form-select-sm" formControlName="idEstudiante">
        <option [ngValue]="null">Todos</option>
        <option *ngFor="let e of estudiantes" [ngValue]="e.id">{{ e.nombre }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label small text-muted mb-1">Profesor</label>
      <select class="form-select form-select-sm" formControlName="idProfesor">
        <option [ngValue]="null">Todos</option>
        <option *ngFor="let p of profesores" [ngValue]="p.id">{{ p.nombre }}</option>
      </select>
    </div>
    <div class="col-md-1 d-flex align-items-end">
      <button type="button" class="btn btn-sm btn-outline-secondary w-100" (click)="clearFilters()"
              title="Limpiar filtros" [disabled]="!hasActiveFilters()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th style="width: 70px;">Id</th>
          <th>Nombre</th>
          <th style="width: 90px;">Valor</th>
          <th>Estudiante</th>
          <th>Profesor</th>
          <th style="width: 200px;" class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let n of paged?.items">
          <td>{{ n.id }}</td>
          <td>{{ n.nombre }}</td>
          <td><span class="badge bg-primary">{{ n.valor }}</span></td>
          <td>{{ n.estudianteNombre }}</td>
          <td>{{ n.profesorNombre }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-2" (click)="openDetail(n)" title="Ver detalle">
              <i class="bi bi-eye"></i>
            </button>
            <button *appIsAdmin class="btn btn-sm btn-outline-secondary me-2" (click)="openEdit(n)" title="Editar">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button *appIsAdmin class="btn btn-sm btn-outline-danger" (click)="remove(n)" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="!loading && paged?.items?.length === 0">
          <td colspan="6" class="text-center text-muted py-4">
            {{ hasActiveFilters() ? 'No se encontraron notas con esos filtros.' : 'No hay notas registradas.' }}
          </td>
        </tr>
        <tr *ngIf="loading">
          <td colspan="6" class="text-center text-muted py-4">Cargando...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-pagination
    *ngIf="paged"
    [pageNumber]="paged.pageNumber"
    [totalPages]="paged.totalPages"
    [hasPreviousPage]="paged.hasPreviousPage"
    [hasNextPage]="paged.hasNextPage"
    [totalCount]="paged.totalCount"
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>

<app-nota-form-modal
  *ngIf="showModal"
  [nota]="selectedNota"
  [estudiantes]="estudiantes"
  [profesores]="profesores"
  (saved)="onFormSaved()"
  (cancelled)="onFormCancelled()">
</app-nota-form-modal>

<app-nota-detail-modal
  *ngIf="showDetailModal && selectedNotaId"
  [notaId]="selectedNotaId"
  (closed)="onDetailClosed()">
</app-nota-detail-modal>
